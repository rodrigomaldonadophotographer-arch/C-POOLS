<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b2b"><title>Administrador | C&C Albercas y Más</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/admin.css"></head><body class="admin-body">
<header class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">C<span>&</span>C</span><span class="brand-copy"><b>ALBERCAS Y MÁS</b><small>ADMINISTRACIÓN DEL CATÁLOGO</small></span></a><a href="index.html" class="back-link">← Ver catálogo</a></header>
<main class="admin-shell"><section id="loginPanel" class="login-card"><p class="eyebrow dark"><span></span> ACCESO PRIVADO</p><h1>Administra tu<br><em>catálogo.</em></h1><p>Inicia sesión con la cuenta autorizada del negocio.</p><form id="loginForm"><label>Correo electrónico<input type="email" id="email" autocomplete="username" required></label><label>Contraseña<input type="password" id="password" autocomplete="current-password" required></label><button class="button button-aqua" type="submit">Entrar <span>↗</span></button><p id="loginMessage" class="form-message"></p></form></section>
<section id="dashboard" class="dashboard" hidden><div class="dashboard-heading"><div><p class="eyebrow dark"><span></span> C&amp;C ALBERCAS Y MÁS</p><h1>Tu catálogo,<br><em>siempre al día.</em></h1></div><button id="logoutButton" class="plain-button">Cerrar sesión</button></div><div class="admin-tabs"><button class="active" data-tab="services">Servicios</button><button data-tab="products">Equipos y productos</button><button data-tab="promotions">Promociones</button></div><div class="admin-layout"><section class="editor-card"><h2 id="editorTitle">Agregar servicio</h2><form id="itemForm"><input type="hidden" id="itemId"><input type="hidden" id="itemType"><label>Nombre<input id="itemName" required maxlength="100"></label><label>Descripción<textarea id="itemDescription" rows="4" maxlength="500"></textarea></label><div id="productFields" hidden><label>Categoría<input id="itemCategory" placeholder="Bombas, filtros, accesorios…"></label><label>Precio (opcional)<input id="itemPrice" type="number" min="0" step="0.01" placeholder="Dejar vacío para cotizar"></label></div><label class="upload-label">Foto JPG o PNG<input id="itemImage" type="file" accept="image/jpeg,image/png"></label><div id="imagePreview" class="image-preview">Sin foto seleccionada</div><button type="button" id="removeImageButton" class="plain-button" hidden>Quitar foto actual</button><label class="check-row"><input id="itemActive" type="checkbox" checked> Mostrar en el catálogo</label><div class="form-actions"><button class="button button-aqua" type="submit">Guardar <span>↗</span></button><button type="button" id="cancelEdit" class="plain-button">Limpiar</button></div><p id="saveMessage" class="form-message"></p></form></section><section class="items-card"><div class="items-heading"><h2 id="listTitle">Servicios publicados</h2><span id="itemCount">0</span></div><div id="itemsList" class="items-list"></div></section></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/admin.js"></script></body></html>
